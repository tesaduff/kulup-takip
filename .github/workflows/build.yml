name: Derle ve Yayınla

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derle ve test et
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -Test

      - name: EXE'yi sakla
        uses: actions/upload-artifact@v4
        with:
          name: KulupTakip
          path: dist/KulupTakip.exe

      - name: Release oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KulupTakip.exe
          generate_release_notes: true
